replicaCount: 1

image:
  repository: registry.fis-cp4d-dev.fis.com.vn:8088/springboot-sample
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

route:
  path: /
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /actuator/health
  initialDelaySeconds: 10
  periodSeconds: 10

env:
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: oracle-db-secret
        key: url
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: oracle-db-secret
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: oracle-db-secret
        key: password
